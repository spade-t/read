<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天记录查看器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- ===== 顶部 ===== -->
        <header id="header">
            <span id="title">💬 与 Bot 的对话</span>
            <div id="search-wrap">
                <input type="text" id="search-input" placeholder="搜索..." autocomplete="off">
                <button id="search-clear" aria-label="清除搜索">✕</button>
                <div id="search-dropdown"></div>
            </div>
            <button id="settings-btn" aria-label="设置">⚙️</button>
        </header>

        <!-- ===== 上传区域 ===== -->
        <div id="upload-zone">
            <div class="icon">📄</div>
            <h2>上传 JSON 文件</h2>
            <div class="drop-area" id="drop-area">
                <p style="margin-bottom:10px;color:#888;font-size:14px;">点击选择文件 或 拖拽到此</p>
                <input type="file" id="file-input" accept=".json">
                <button class="upload-btn" id="upload-btn">选择 JSON 文件</button>
            </div>
            <div id="progress-wrap">
                <div id="progress-text">
                    <span class="pname" id="pname">文件名</span>
                    <span id="pstatus">0%</span>
                </div>
                <div id="progress-bar-bg">
                    <div id="progress-bar"></div>
                </div>
                <div style="font-size:12px;color:#888;" id="pdetail">准备解析...</div>
            </div>
        </div>

        <!-- ===== 消息列表 ===== -->
        <div id="messages-container" style="display:none;"></div>

        <!-- ===== 底部 ===== -->
        <footer id="footer" style="display:none;">
            <span class="fcount" id="msg-count">总消息: 0 条</span>
        </footer>
    </div>

    <!-- ===== 设置面板 ===== -->
    <div id="settings-overlay">
        <div id="settings-panel">
            <div class="s-header">
                <span>⚙️ 设置</span>
                <button id="settings-close">✕</button>
            </div>

            <div class="s-group">
                <div class="s-title"><span class="icon">📝</span> 名称</div>
                <div class="s-row">
                    <label>我的名称</label>
                    <input type="text" id="s-user-name" placeholder="例如: 我" value="我">
                </div>
                <div class="s-row">
                    <label>Bot 名称</label>
                    <input type="text" id="s-bot-name" placeholder="例如: 蒂法" value="Bot">
                </div>
            </div>

            <div class="s-group">
                <div class="s-title"><span class="icon">🖼️</span> 头像</div>
                <div class="s-row">
                    <label>我的头像</label>
                    <div class="s-avatar-row">
                        <img id="s-user-avatar-preview" class="preview" src="" alt="预览">
                        <span class="file-input-wrap">
                            <span class="file-btn">选择图片</span>
                            <input type="file" id="s-user-avatar-input" accept="image/*">
                        </span>
                        <button class="reset-btn" data-target="user-avatar">恢复默认</button>
                    </div>
                </div>
                <div class="s-row">
                    <label>Bot 头像</label>
                    <div class="s-avatar-row">
                        <img id="s-bot-avatar-preview" class="preview" src="" alt="预览">
                        <span class="file-input-wrap">
                            <span class="file-btn">选择图片</span>
                            <input type="file" id="s-bot-avatar-input" accept="image/*">
                        </span>
                        <button class="reset-btn" data-target="bot-avatar">恢复默认</button>
                    </div>
                </div>
            </div>

            <div class="s-group">
                <div class="s-title"><span class="icon">🎨</span> 聊天背景</div>
                <div class="s-row">
                    <label>背景图片</label>
                    <div class="s-avatar-row">
                        <img id="s-bg-preview" class="preview bg-preview" src="" alt="背景预览">
                        <span class="file-input-wrap">
                            <span class="file-btn">选择图片</span>
                            <input type="file" id="s-bg-input" accept="image/*">
                        </span>
                        <button class="reset-btn" data-target="bg">恢复默认</button>
                    </div>
                </div>
            </div>

            <div class="s-group">
                <div class="s-title"><span class="icon">💾</span> 数据管理</div>
                <div class="s-data-row">
                    <button id="s-upload-json" class="primary">📤 上传JSON</button>
                    <button id="s-export-md" class="primary">📥 导出MD</button>
                    <button id="s-clear-data" class="danger">🗑️ 清空所有数据</button>
                </div>
                <div style="font-size:12px;color:#888;margin-top:8px;" id="s-data-size">数据大小: 0 MB</div>
            </div>

            <button class="s-save-btn" id="s-save">💾 保存设置</button>
        </div>
    </div>

    <!-- ===== 确认弹窗 ===== -->
    <div id="confirm-overlay">
        <div id="confirm-box">
            <div class="c-icon">💔</div>
            <div class="c-title" id="confirm-title">确认删除</div>
            <div class="c-desc" id="confirm-desc">这是属于你们的回忆噢，删除后不可恢复！</div>
            <div class="c-actions">
                <button class="c-cancel" id="confirm-cancel">取消</button>
                <button class="c-confirm" id="confirm-ok">确定删除</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
