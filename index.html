<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天记录查看器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- 顶部头部 -->
    <header id="header">
        <div id="top-row">
            <button class="icon-btn" id="calendar-btn" title="打开日历">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M3 10h18"/>
                    <path d="M8 2v4"/>
                    <path d="M16 2v4"/>
                </svg>
            </button>
            <h1 id="title">与 Bot 的回忆录</h1>
            <button class="icon-btn" id="settings-btn" title="设置">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
        <div id="search-row">
            <div id="search-wrap">
                <input type="text" id="search-input" placeholder="搜索消息内容">
                <button id="search-clear">×</button>
                <div id="search-dropdown"></div>
            </div>
        </div>
    </header>

    <!-- 空白上传区域 -->
    <div id="upload-zone">
        <div class="icon">📄</div>
        <h2>上传聊天JSON文件加载记录</h2>
        <button class="upload-btn" id="upload-btn">选择JSON文件</button>
        <input type="file" id="file-input" accept=".json" hidden>
        <div id="progress-wrap">
            <div id="progress-text">
                <span class="pname"></span>
                <span id="pstatus">0%</span>
            </div>
            <div id="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
            <div id="pdetail">正在解析文件...</div>
        </div>
    </div>

    <!-- 消息容器 -->
    <div id="messages-container" style="display:none;"></div>

    <!-- 底部统计栏 -->
    <footer id="footer" style="display:none;">
        <span class="fcount" id="msg-count">总消息：0 条</span>
    </footer>

    <!-- 设置侧边弹窗 -->
    <div id="settings-overlay">
        <div id="settings-panel">
            <div class="s-header">
                <span>全局设置</span>
                <button id="settings-close">×</button>
            </div>
            <div class="s-group">
                <div class="s-title">聊天名称设置</div>
                <hr class="s-divider">
                <div class="s-row-inline">
                    <label>我的名称</label>
                    <input type="text" id="s-user-name" placeholder="我">
                </div>
                <div class="s-row-inline">
                    <label>Bot名称</label>
                    <input type="text" id="s-bot-name" placeholder="Bot">
                </div>
            </div>
            <div class="s-group">
                <div class="s-title">头像设置</div>
                <hr class="s-divider">
                <div class="s-avatar-group">
                    <div class="s-avatar-item">
                        <label>我的头像</label>
                        <div class="s-avatar-row">
                            <img id="s-user-avatar-preview" class="preview">
                            <div class="file-input-wrap">
                                <span class="file-btn">更换图片</span>
                                <input type="file" id="s-user-avatar-input" accept="image/*">
                            </div>
                        </div>
                    </div>
                    <div class="s-avatar-item">
                        <label>Bot头像</label>
                        <div class="s-avatar-row">
                            <img id="s-bot-avatar-preview" class="preview">
                            <div class="file-input-wrap">
                                <span class="file-btn">更换图片</span>
                                <input type="file" id="s-bot-avatar-input" accept="image/*">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="s-group">
                <div class="s-title">聊天背景图</div>
                <hr class="s-divider">
                <div class="s-row">
                    <div class="s-avatar-row">
                        <div class="file-input-wrap">
                            <span class="file-btn">上传背景图</span>
                            <input type="file" id="s-bg-input" accept="image/*">
                        </div>
                    </div>
                </div>
            </div>
            <div class="s-group">
                <div class="s-title">主题模式</div>
                <hr class="s-divider">
                <div class="s-theme-row">
                    <button class="theme-btn" data-theme="light">浅色模式</button>
                    <button class="theme-btn" data-theme="dark">深色模式</button>
                </div>
            </div>
            <div class="s-group">
                <div class="s-title">数据操作</div>
                <hr class="s-divider">
                <div class="s-data-row">
                    <button id="s-upload-json">重新上传JSON</button>
                    <button id="s-export-md" class="primary">导出MD记录</button>
                    <button id="s-clear-data" class="danger">清空全部数据</button>
                </div>
                <div id="s-data-size" style="margin-top:8px;font-size:13px;color:var(--text-secondary);">数据大小：0 MB</div>
            </div>
            <button id="s-save" class="s-save-btn">保存全部设置</button>
        </div>
    </div>

    <!-- 日历弹窗 -->
    <div id="calendar-overlay">
        <div id="calendar-panel">
            <div class="cal-header">
                <div class="cal-month" id="calendar-month">2026年 八月 ▼</div>
                <div class="cal-nav">
                    <button id="calendar-prev">‹</button>
                    <button id="calendar-next">›</button>
                </div>
            </div>
            <div class="cal-weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendar-days" class="cal-days"></div>
        </div>
    </div>

    <!-- 确认删除弹窗 -->
    <div id="confirm-overlay">
        <div id="confirm-box">
            <div class="c-icon">⚠️</div>
            <h3 class="c-title" id="confirm-title">确认操作</h3>
            <p class="c-desc" id="confirm-desc">执行后无法撤销，确定继续吗？</p>
            <div class="c-actions">
                <button class="c-cancel" id="confirm-cancel">取消</button>
                <button class="c-confirm" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
