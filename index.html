<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天记录查看器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <!-- 顶部头部 -->
    <div id="header">
        <div id="top-row">
            <button class="icon-btn" id="calendar-btn" title="打开日历跳转">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <path d="M3 10h18"></path>
                    <path d="M8 2v4"></path>
                    <path d="M16 2v4"></path>
                </svg>
            </button>
            <div id="title">与 Bot 的回忆录</div>
            <button class="icon-btn" id="settings-btn" title="设置">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
        <div id="search-row">
            <div id="search-wrap">
                <input type="text" id="search-input" placeholder="搜索消息内容">
                <button id="search-clear">×</button>
                <div id="search-dropdown"></div>
            </div>
        </div>
    </div>

    <!-- 空白上传区域 -->
    <div id="upload-zone">
        <div class="icon">📄</div>
        <h2>上传聊天记录 JSON 文件</h2>
        <button class="upload-btn" id="upload-btn">选择文件上传</button>
        <input type="file" id="file-input" accept=".json" hidden>
        <div id="progress-wrap">
            <div id="progress-text">
                <span class="pname"></span>
                <span class="pstatus"></span>
            </div>
            <div id="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
            <div id="pdetail"></div>
        </div>
    </div>

    <!-- 消息列表容器 -->
    <div id="messages-container" style="display: none;"></div>

    <!-- 底部统计栏 -->
    <div id="footer" style="display: none;">
        <span class="fcount" id="msg-count">总消息：0 条</span>
    </div>

    <!-- 设置侧边弹窗 -->
    <div id="settings-overlay">
        <div id="settings-panel">
            <div class="s-header">
                <span>设置</span>
                <button id="settings-close">×</button>
            </div>

            <div class="s-group">
                <div class="s-title">对话名称</div>
                <hr class="s-divider">
                <div class="s-row-inline">
                    <label>我的昵称</label>
                    <input type="text" id="s-user-name" placeholder="我">
                </div>
                <div class="s-row-inline">
                    <label>对方昵称</label>
                    <input type="text" id="s-bot-name" placeholder="Bot">
                </div>
            </div>

            <div class="s-group">
                <div class="s-title">头像设置</div>
                <hr class="s-divider">
                <div class="s-avatar-group">
                    <div class="s-avatar-item">
                        <label>我的头像</label>
                        <div class="s-avatar-row">
                            <img class="preview" id="s-user-avatar-preview">
                            <span class="file-input-wrap">
                                <span class="file-btn">选择图片</span>
                                <input type="file" id="s-user-avatar-input" accept="image/*">
                            </span>
                        </div>
                    </div>
                    <div class="s-avatar-item">
                        <label>对方头像</label>
                        <div class="s-avatar-row">
                            <img class="preview" id="s-bot-avatar-preview">
                            <span class="file-input-wrap">
                                <span class="file-btn">选择图片</span>
                                <input type="file" id="s-bot-avatar-input" accept="image/*">
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="s-group">
                <div class="s-title">聊天背景图</div>
                <hr class="s-divider">
                <div class="s-row">
                    <span class="file-input-wrap">
                        <span class="file-btn">上传背景图片</span>
                        <input type="file" id="s-bg-input" accept="image/*">
                    </span>
                </div>
            </div>

            <div class="s-group">
                <div class="s-title">显示主题</div>
                <hr class="s-divider">
                <div class="s-theme-row">
                    <button class="theme-btn" data-theme="light">浅色模式</button>
                    <button class="theme-btn" data-theme="dark">深色模式</button>
                </div>
            </div>

            <div class="s-group">
                <div class="s-title">数据操作</div>
                <hr class="s-divider">
                <div class="s-data-row">
                    <button id="s-upload-json">重新上传JSON</button>
                    <button id="s-export-md" class="primary">导出MD文档</button>
                    <button id="s-clear-data" class="danger">清空全部记录</button>
                </div>
                <div style="margin-top:8px;font-size:13px;color:var(--text-secondary);">
                    当前存储大小：<span id="s-data-size">0 MB</span>
                </div>
            </div>

            <button class="s-save-btn" id="s-save">保存全部设置</button>
        </div>
    </div>

    <!-- 日历弹窗 -->
    <div id="calendar-overlay">
        <div id="calendar-panel">
            <div class="cal-header">
                <div class="cal-month" id="calendar-month">2026年 八月 ▼</div>
                <div class="cal-nav">
                    <button id="calendar-prev">&lt;</button>
                    <button id="calendar-next">&gt;</button>
                </div>
            </div>
            <div class="cal-weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="cal-days" id="calendar-days"></div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-overlay">
        <div id="confirm-box">
            <div class="c-icon">⚠️</div>
            <div class="c-title" id="confirm-title">确认操作</div>
            <div class="c-desc" id="confirm-desc">确定要执行此操作吗？</div>
            <div class="c-actions">
                <button class="c-cancel" id="confirm-cancel">取消</button>
                <button class="c-confirm" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
